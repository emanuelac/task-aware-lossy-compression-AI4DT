[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tsdb-ml-pipeline"
version = "0.1.0"
description = "Task-aware vs task-agnostic lossy compression for time-series databases"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
